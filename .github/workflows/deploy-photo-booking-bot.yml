name: Deploy photo booking bot
# trigger: 2026-07-04 — read relay secret from site-api .env on VPS

on:
  push:
    branches: ["main"]
    paths:
      - "photo-booking-bot/**"
      - "ecosystem.config.cjs"
      - "server/src/photoBooking.js"
      - ".github/workflows/deploy-photo-booking-bot.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy photo booking bot on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.VPS_APP_PATH }}"
            git fetch --all
            git reset --hard origin/main

            if [ -n "${{ secrets.ANNA_ADMIN_PASSWORD }}" ]; then
              python3 server/deploy/patch_dotenv.py ANNA_ADMIN_PASSWORD "${{ secrets.ANNA_ADMIN_PASSWORD }}"
            fi

            cd photo-booking-bot
            touch .env

            patch_bot_env() {
              KEY="$1"
              VAL="$2"
              if [ -n "$VAL" ]; then
                python3 ../server/deploy/patch_dotenv.py "$KEY" "$VAL"
              fi
            }

            patch_bot_env BOT_TOKEN "${{ secrets.PHOTO_BOOKING_BOT_TOKEN }}"
            patch_bot_env ADMIN_ID "${{ secrets.PHOTO_BOOKING_ADMIN_ID }}"
            patch_bot_env PHONE "${{ secrets.PHOTO_BOOKING_PHONE }}"
            patch_bot_env RECIPIENT_NAME "${{ secrets.PHOTO_BOOKING_RECIPIENT_NAME }}"

            if [ -n "${{ secrets.TELEGRAM_BOT_PROXY_URL }}" ]; then
              patch_bot_env TELEGRAM_BOT_PROXY_URL "${{ secrets.TELEGRAM_BOT_PROXY_URL }}"
            elif [ -n "${{ secrets.TELEGRAM_RELAY_URL }}" ]; then
              patch_bot_env TELEGRAM_BOT_PROXY_URL "${{ secrets.TELEGRAM_RELAY_URL }}"
            elif [ -f ../.env ] && grep -q '^TELEGRAM_RELAY_URL=' ../.env; then
              RELAY_URL=$(grep '^TELEGRAM_RELAY_URL=' ../.env | cut -d= -f2- | tr -d '"')
              patch_bot_env TELEGRAM_BOT_PROXY_URL "$RELAY_URL"
            else
              patch_bot_env TELEGRAM_BOT_PROXY_URL "https://telegram-relay.coffeenechai.workers.dev"
            fi
            BOT_PROXY_SECRET="${{ secrets.TELEGRAM_BOT_PROXY_SECRET }}"
            if [ -z "$BOT_PROXY_SECRET" ]; then
              BOT_PROXY_SECRET="${{ secrets.TELEGRAM_RELAY_SECRET }}"
            fi
            if [ -z "$BOT_PROXY_SECRET" ] && [ -f ../.env ]; then
              BOT_PROXY_SECRET=$(grep '^TELEGRAM_RELAY_SECRET=' ../.env | cut -d= -f2- | tr -d '"')
            fi
            if [ -n "$BOT_PROXY_SECRET" ]; then
              patch_bot_env TELEGRAM_BOT_PROXY_SECRET "$BOT_PROXY_SECRET"
            fi

            if [ -n "${{ secrets.TELEGRAM_HTTPS_PROXY }}" ]; then
              patch_bot_env HTTPS_PROXY "${{ secrets.TELEGRAM_HTTPS_PROXY }}"
            elif [ -n "${{ secrets.HTTPS_PROXY }}" ]; then
              patch_bot_env HTTPS_PROXY "${{ secrets.HTTPS_PROXY }}"
            fi

            if ! grep -q '^BOT_TOKEN=.\+' .env; then
              echo "ERROR: BOT_TOKEN missing in photo-booking-bot/.env"
              echo "Add GitHub secret PHOTO_BOOKING_BOT_TOKEN or create .env on VPS manually"
              exit 1
            fi

            if ! command -v python3 >/dev/null; then
              echo "python3 required on VPS"
              exit 1
            fi

            if [ ! -f .venv/bin/python ]; then
              echo "[deploy] creating photo-booking-bot venv (missing or broken .venv)"
              rm -rf .venv
              python3 -m venv .venv
            fi
            .venv/bin/pip install -q -r requirements.txt

            cd ..
            pm2 delete photo-booking-bot 2>/dev/null || true
            pm2 start ecosystem.config.cjs --only photo-booking-bot
            pm2 save
            sleep 3
            pm2 logs photo-booking-bot --lines 40 --nostream || true
            pm2 status photo-booking-bot || true
            if pm2 describe photo-booking-bot 2>/dev/null | grep -q online; then
              echo "[deploy] photo-booking-bot is online"
            else
              echo "[deploy] WARNING: photo-booking-bot not online — see logs above"
              pm2 logs photo-booking-bot --lines 80 --nostream || true
            fi
            grep -E '^(TELEGRAM_BOT_PROXY_URL|TELEGRAM_BOT_PROXY_SECRET)=' photo-booking-bot/.env || true
